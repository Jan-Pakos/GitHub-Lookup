version: "3.8"
services:
  db:
    image: postgres:15
    container_name: mydatabase
    restart: always
    ports:
      - "54321:5432"
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydatabase   # optional, creates a default DB
    volumes:
      - local_pgdata:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_containerFORGITHUB
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: jan@example.com
      PGADMIN_DEFAULT_PASSWORD: admin

volumes:
  local_pgdata:
